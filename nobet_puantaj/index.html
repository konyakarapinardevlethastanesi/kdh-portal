<script>
const K='nobet_v1',pad=n=>String(n).padStart(2,'0'),iso=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d),key=(y,m)=>y+'-'+pad(m);

const HOL=[['2026-01-01','Yeni Yıl'],['2026-03-19','Ramazan Bayramı (Arife)',1],['2026-03-20','Ramazan Bayramı 1. Gün'],['2026-03-21','Ramazan Bayramı 2. Gün'],['2026-03-22','Ramazan Bayramı 3. Gün'],['2026-04-23','Ulusal Egemenlik ve Çocuk Bayramı'],['2026-05-01','Emek ve Dayanışma Günü'],['2026-05-19','Atatürk’ü Anma, Gençlik ve Spor Bayramı'],['2026-05-26','Kurban Bayramı (Arife)',1],['2026-05-27','Kurban Bayramı 1. Gün'],['2026-05-28','Kurban Bayramı 2. Gün'],['2026-05-29','Kurban Bayramı 3. Gün'],['2026-05-30','Kurban Bayramı 4. Gün'],['2026-07-15','Demokrasi ve Milli Birlik Günü'],['2026-08-30','Zafer Bayramı'],['2026-10-28','Cumhuriyet Bayramı Öncesi',1],['2026-10-29','Cumhuriyet Bayramı'],['2027-01-01','Yılbaşı Tatili'],['2027-03-08','Ramazan Bayramı Arifesi',1],['2027-03-09','Ramazan Bayramı 1. Gün'],['2027-03-10','Ramazan Bayramı 2. Gün'],['2027-03-11','Ramazan Bayramı 3. Gün'],['2027-04-23','Ulusal Egemenlik ve Çocuk Bayramı'],['2027-05-01','Emek ve Dayanışma Günü'],['2027-05-15','Kurban Bayramı Arifesi',1],['2027-05-16','Kurban Bayramı 1. Gün'],['2027-05-17','Kurban Bayramı 2. Gün'],['2027-05-18','Kurban Bayramı 3. Gün'],['2027-05-19','Atatürk’ü Anma, Gençlik ve Spor Bayramı'],['2027-07-15','Demokrasi ve Milli Birlik Günü'],['2027-08-30','Zafer Bayramı'],['2027-10-28','Cumhuriyet Bayramı Arifesi',1],['2027-10-29','Cumhuriyet Bayramı']].map(a=>({t:a[0],a:a[1],r:a[2]||0}));
const LEG=[['Yİ','Yıllık İzin','NÖİ','Nöbet İzni'],['R','Rapor','GG','Geçici Görev'],['E','Eğitim','T','Tayin'],['Üİ','Ücretsiz İzin','M','Mazeret İzni'],['HY','Hastane Yatış','SD','Servis Değişikliği'],['B','Başlayış','A','Ayrılış'],['Bİ','Babalık İzni','Nİ','Nikah İzni'],['HR','Heyet Raporu','İD','İdari İzin']];
let D;
if(!D){const n=new Date();D={units:{},codes:[{k:'08:08',s:24},{k:'16:08',s:16},{k:'08:16',s:8}],leave:LEG.flat().filter((x,i)=>i%2==0).concat(['Şİ','Rİ','Öİ','DÖ','DS']),hol:HOL,cur:{u:'',y:n.getFullYear(),m:n.getMonth()+1},tab:'nob',hosp:'KARAPINAR DEVLET HASTANESİ'}}

const cu=()=>D.units[D.cur.u],mkey=()=>key(D.cur.y,D.cur.m),dim=(y,m)=>new Date(y,m,0).getDate();
function mo(y,m){const U=cu();y=y||D.cur.y;m=m||D.cur.m;return U.m[key(y,m)]||(U.m[key(y,m)]={c:{}})}
const isL=v=>v!==''&&v!=null&&D.leave.some(l=>tu(l)==tu(v)),nc=v=>D.codes.find(c=>tu(c.k)==tu(v));
const holSet=()=>new Set(D.hol.map(h=>h.t));
function ov(p,y,m,d){const t=iso(y,m,d);if(p.bas&&t<p.bas)return'B.';if(p.ayr&&t>p.ayr)return'A.';return null}
function get(p,d,y,m){y=y||D.cur.y;m=m||D.cur.m;const o=ov(p,y,m,d);if(o)return[o,o,1];const c=cu().m[key(y,m)];return(c&&c.c[p.id+'_'+d])||['','']}
function stats(p){const{y,m}=D.cur,n=dim(y,m),H=holSet();let isg=0,iz=0,h=0;for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay(),g=get(p,d),b=g[1];if(w>0&&w<6&&!H.has(iso(y,m,d))){isg++;if(g[2]||isL(b)||isL(g[0]))iz++}const x=parseFloat(b);if(!g[2]&&!isNaN(x)&&!isL(b))h+=x}
const ar=D.hol.filter(x=>x.r&&x.t.startsWith(key(y,m))).length;const ay=(isg-iz)*8+5*ar;return{isg,iz,h,ay,fz:h-ay,ar,isgT:isg}}
function setC(id,d,r,v){const M=mo(),k=id+'_'+d,c=M.c[k]||['',''];v=v.trim();
if(r==0){if(v==''){if(isL(c[0])||(nc(c[0])&&String(nc(c[0]).s)==String(c[1])))c[1]='';c[0]=''}else if(isL(v)){c[0]=v;c[1]=v}else{c[0]=v;const k2=nc(v);if(k2)c[1]=String(k2.s)}}
else{c[1]=v;if(isL(v)&&!c[0])c[0]=v}
if(c[0]==''&&c[1]=='')delete M.c[k];else M.c[k]=c;sv();R()}
function addU(){const n=prompt('Birim adı (ör. ACİL SERVİS)');if(!n||D.units[n])return;D.units[n]={info:{servis:n,yatak:'',h1:'',h1u:'Birim Sorumlusu',h2:'',h2u:'',h3:'',h3u:''},cfg:{tur:24,min:1,max:2},p:[],m:{}};D.cur.u=n;sv();R()}
function modal(h){document.getElementById('md').innerHTML='<div class="mod" onclick="if(event.target==this)cl()"><div>'+h+'</div></div>'}const cl=()=>document.getElementById('md').innerHTML='';
function home(){const U=cu();if(!U)return addU();const i=U.info;const f=(k,l)=>`<label>${l}</label><input id="i_${k}" value="${esc(i[k])}">`;
modal(`<h3>Ana Sayfa</h3><label>Hastane</label><input id="i_hosp" value="${esc(D.hosp)}">${f('servis','Servis / Birim adı')}${f('yatak','Yatak sayısı')}${f('h1','Hazırlayan')}${f('h1u','Unvanı')}${f('h2','Kontrol eden')}${f('h2u','Unvanı')}${f('h3','Onaylayan')}${f('h3u','Unvanı')}<p><button class="p" onclick="saveHome()">Kaydet</button> <button onclick="cl()">Kapat</button></p>`)}
function saveHome(){const i=cu().info;['servis','yatak','h1','h1u','h2','h2u','h3','h3u'].forEach(k=>i[k]=document.getElementById('i_'+k).value);D.hosp=document.getElementById('i_hosp').value;sv();cl();R()}
function openP(id){const p=cu().p.find(x=>x.id==id)||{id:'',ad:'',un:'',bas:'',ayr:''};
modal(`<h3>${id?'Personel':'Yeni personel'}</h3><label>Adı soyadı</label><input id="p_ad" value="${esc(p.ad)}"><label>Ünvanı / Branşı</label><input id="p_un" value="${esc(p.un)}"><label>Başlayış tarihi (ay içinde işe başladıysa)</label><input type="date" id="p_bas" value="${p.bas||''}"><label>Ayrılış tarihi</label><input type="date" id="p_ayr" value="${p.ayr||''}"><p><button class="p" onclick="saveP('${id}')">Kaydet</button> ${id?`<button onclick="delP('${id}')">Sil</button>`:''} <button onclick="cl()">Kapat</button></p>`)}
function saveP(id){const g=k=>document.getElementById('p_'+k).value,U=cu();if(!g('ad').trim())return;let p=U.p.find(x=>x.id==id);if(!p){p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};U.p.push(p)}p.ad=g('ad').trim();p.un=g('un');p.bas=g('bas');p.ayr=g('ayr');sv();cl();R()}
function delP(id){if(!confirm('Personel silinsin mi? (Geçmiş aylardaki kayıtlar da bu kişiden kalkar)'))return;const U=cu();U.p=U.p.filter(x=>x.id!=id);sv();cl();R()}
/* otomatik nöbet */
function auto(){const U=cu(),{y,m}=D.cur,n=dim(y,m),tp=+U.cfg.tur,mn=+U.cfg.min,mx=+U.cfg.max,code=D.codes.find(c=>+c.s==tp);if(!code)return alert('Nöbet Kodları sekmesinde '+tp+' saatlik kod yok.');
const pm=m==1?12:m-1,py=m==1?y-1:y,pn=dim(py,pm),P=U.p,sh={},cap={},cnt={};
P.forEach(p=>{sh[p.id]=[];for(let d=pn-2;d<=pn;d++){const b=parseFloat(get(p,d,py,pm)[1]);if(b>=16)sh[p.id].push(d-pn)}for(let d=1;d<=n;d++){const g=get(p,d),b=parseFloat(g[1]);if(!g[2]&&b>=16)sh[p.id].push(d)}const s=stats(p);cap[p.id]=Math.max(0,Math.floor((s.ay-s.h)/tp));cnt[p.id]=0});
const warn=[];let tot=Object.values(cap).reduce((a,b)=>a+b,0);if(tot<mn*n)warn.push('Personel yetmiyor: en az '+mn*n+' nöbet gerekir, aylık saatlere göre en fazla '+tot+' nöbet yazılabilir.');
const ok=(p,d,g)=>sh[p.id].every(s=>Math.abs(d-s)>=g+1);
for(let d=1;d<=n;d++){const M=mo();let have=P.filter(p=>{const g=get(p,d);return !g[2]&&parseFloat(g[1])>=16}).length;const left=n-d+1,rc=Object.values(cap).reduce((a,b)=>a+b,0);let tg=Math.max(mn,Math.min(mx,Math.round(rc/left)));
for(const gap of[2,1]){if(have>=tg)break;const cand=P.filter(p=>{const g=get(p,d);return !g[2]&&g[0]==''&&g[1]==''&&cap[p.id]>0&&ok(p,d,gap)}).sort((a,b)=>cap[b.id]-cap[a.id]||cnt[a.id]-cnt[b.id]);
for(const p of cand){if(have>=tg||(gap==1&&have>=mn))break;M.c[p.id+'_'+d]=[code.k,String(tp)];sh[p.id].push(d);cap[p.id]--;cnt[p.id]++;have++}}
if(have<mn)warn.push(d+'. gün: '+have+' kişi (en az '+mn+' olmalı)')}
sv();R();if(warn.length)alert(warn.join('\n'))}
/* görünüm */
function legend(){return'<table><tr>'+LEG.map((g,i)=>`<td class="${i%2?'gr':'bl'}">${g[0]}.</td><td>${g[1]}</td><td class="${i%2?'gr':'bl'}">${g[2]}.</td><td>${g[3]}</td>`).join('')+'</tr></table>'}
function head(title,U,ay,cols){const{y,m}=D.cur,n=dim(y,m),H=holSet();let isg=0;for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay();if(w>0&&w<6&&!H.has(iso(y,m,d)))isg++}const ar=D.hol.filter(x=>x.r&&x.t.startsWith(key(y,m))).length;
return`<table style="width:100%"><tr><td class="t1" colspan="3">${esc(D.hosp)} ${title}</td></tr><tr><td class="t2">Birim: ${esc(U.info.servis)} ${esc(U.info.yatak)}</td><td class="t2">Yıl: ${y} · Ay: ${MON[m-1]}</td><td class="t2">Dönem: ${n} gün · İş günü: ${isg} · Aylık çalışma saati: ${isg*8+5*ar}${ar?' (arife +5)':''}</td></tr></table>`+legend()}
function sign(U){const i=U.info;return'<div class="sg">'+[[i.h1,i.h1u,'Hazırlayan'],[i.h2,i.h2u,'Kontrol Eden'],[i.h3,i.h3u,'Onaylayan']].map(a=>`<div>${a[2]}<b>${esc(a[0])}</b>${esc(a[1])}</div>`).join('')+'</div>'}
function dayHead(){const{y,m}=D.cur,n=dim(y,m),H=holSet();let a='',b='';for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay(),c=H.has(iso(y,m,d))?'hl':(w==0||w==6?'wk':'');a+=`<th class="${c||'hd'}">${d}</th>`;b+=`<th class="${c||'hd'}">${DN[w]}</th>`}return[a,b,n]}
function colCls(d){const{y,m}=D.cur,w=new Date(y,m-1,d).getDay();return holSet().has(iso(y,m,d))?'hl':(w==0||w==6?'wk':'')}
function sheet(kind){const U=cu(),{y,m}=D.cur,[h1,h2,n]=dayHead(),P=U.p,pages=[];for(let i=0;i<Math.max(P.length,1);i+=15)pages.push(P.slice(i,i+15));
const two=kind=='nob';return pages.map((pp,pi)=>{let rows='';const tot={8:Array(n+1).fill(0),16:Array(n+1).fill(0),24:Array(n+1).fill(0)};
pp.forEach((p,j)=>{const s=stats(p);let r1='',r2='';for(let d=1;d<=n;d++){const g=get(p,d),c=colCls(d);if(g[2]){r1+=`<td class="ov">${g[0]}</td>`;r2+=`<td class="ov">${g[0]}</td>`}else{const b=parseFloat(g[1]);if(b==8||b==5||b==23)tot[8][d]++;if(b==16||b==23)tot[16][d]++;if(b==24)tot[24][d]++;
r1+=`<td class="${c}"><input class="top" value="${esc(g[0])}" onchange="setC('${p.id}',${d},0,this.value)"></td>`;r2+=`<td class="${c}"><input value="${esc(g[1])}" onchange="setC('${p.id}',${d},1,this.value)"></td>`}}
const rs=two?2:1,num=pi*15+j+1,L=`<td rowspan="${rs}">${num}</td><td rowspan="${rs}" class="nm" onclick="openP('${p.id}')">${esc(p.ad)}</td><td rowspan="${rs}">${esc(p.un)}</td><td rowspan="${rs}">${s.iz}</td>`,R2=`<td rowspan="${rs}" class="hd">${s.h}</td><td rowspan="${rs}">${s.ay}</td><td rowspan="${rs}" style="font-weight:700;${s.fz>0?'color:#b00':''}">${s.fz}</td>`;
rows+=two?`<tr>${L}${r1}${R2}</tr><tr>${r2}</tr>`:`<tr>${L}${r2}${R2}</tr>`});
for(let e=pp.length;e<15&&pi==pages.length-1&&e<pp.length+0;e++);
